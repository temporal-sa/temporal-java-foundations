// `gradle :starter:run` launches the worker; VSCode uses launch.json mainClass instead.
application {
    mainClass = 'foundations.WorkerApp'
}

// `gradle :starter:runStarter --args="3 4"` starts a MathWorkflow.
tasks.register('runStarter', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'foundations.Starter'
}

// `gradle :starter:runSignal --args="5"` sends the submit(int) signal.
tasks.register('runSignal', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'foundations.SignalSender'
}
