// Root build. Common configuration lives here so the two modules (`starter` and
// `solution`) stay identical apart from the code you write inside them.
subprojects {
    apply plugin: 'application'

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'io.temporal:temporal-sdk:1.25.0'
        // Quiets SLF4J "no provider" warnings from the SDK.
        implementation 'ch.qos.logback:logback-classic:1.5.6'
    }

    java {
        // Compile with whatever JDK you have (17+), producing Java 17 bytecode so the
        // app runs on Java 17 and newer. No toolchain auto-download required.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
